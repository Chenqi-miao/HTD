<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
    <linearGradient id="grad-in" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d1ecf9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-embed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e6ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0ccff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-trans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">PVANet Architecture — Position-Velocity-Acceleration Network (Hand Joints)</text>
  <text x="550" y="55" text-anchor="middle" font-size="13" fill="#7f8c8d">Strictly following HTD-Refine (Sec 3.2, Fig 3) — adapted for 3D hand joint input</text>

  <!-- ============================================================ -->
  <!-- INPUT -->
  <!-- ============================================================ -->
  <rect x="420" y="75" width="260" height="60" rx="10" fill="url(#grad-in)" stroke="#3498db" stroke-width="2"/>
  <text x="550" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">Input 3D Joint Sequence</text>
  <text x="550" y="120" text-anchor="middle" font-size="12" fill="#555">[B, V=1, F=15, J=21, 3]</text>
  <text x="550" y="135" text-anchor="middle" font-size="10" fill="#888">抖动 3D 关键点 (世界坐标, mm)</text>
  <line x1="550" y1="135" x2="550" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- NORMALIZE -->
  <!-- ============================================================ -->
  <rect x="460" y="163" width="180" height="42" rx="6" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="550" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#d35400">Normalize</text>
  <text x="550" y="198" text-anchor="middle" font-size="10" fill="#888">(x − center) / 300</text>
  <line x1="550" y1="205" x2="550" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- JOINT EMBEDDING -->
  <!-- ============================================================ -->
  <rect x="420" y="233" width="260" height="55" rx="8" fill="url(#grad-embed)" stroke="#8e44ad" stroke-width="2"/>
  <text x="550" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#6c3483">Joint Embedding</text>
  <text x="550" y="272" text-anchor="middle" font-size="11" fill="#555">Linear(3 → 256) + Mean Pool over J</text>
  <text x="220" y="270" text-anchor="middle" font-size="10" fill="#666">[B*V, F, J, 3] → [B*V, F, 256]</text>
  <line x1="550" y1="288" x2="550" y2="313" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- TEMPORAL TRANSFORMER (folding detail) -->
  <!-- ============================================================ -->

  <!-- x8 label -->
  <rect x="190" y="325" width="40" height="280" rx="6" fill="none" stroke="#e67e22" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="210" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#e67e22" transform="rotate(-90,210,470)">×8</text>

  <rect x="250" y="316" width="600" height="290" rx="12" fill="url(#grad-trans)" stroke="#e67e22" stroke-width="2"/>
  <text x="550" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#d35400">Temporal Transformer Decoder ×8 (with RoPE)</text>
  <text x="550" y="355" text-anchor="middle" font-size="11" fill="#777">Input: [B*V, F, 256] → Output: [B*V, F, 256]</text>

  <!-- Single block detail -->
  <rect x="295" y="370" width="510" height="50" rx="6" fill="#fff" stroke="#f39c12" stroke-width="1"/>
  <text x="310" y="392" font-size="11" font-weight="bold" fill="#2c3e50">LayerNorm</text>
  <text x="390" y="392" font-size="11" fill="#555">→</text>
  <text x="415" y="392" font-size="11" font-weight="bold" fill="#8e44ad">Temporal Self-Attention</text>
  <text x="575" y="392" font-size="10" fill="#888">(Q·K·V Linear + RoPE + Scale + Softmax)</text>
  <text x="310" y="410" font-size="10" fill="#666">Q/K 在全特征维度上旋转 (repeat_interleave 2)</text>

  <rect x="295" y="430" width="510" height="50" rx="6" fill="#fff" stroke="#f39c12" stroke-width="1"/>
  <text x="310" y="452" font-size="11" font-weight="bold" fill="#2c3e50">LayerNorm</text>
  <text x="390" y="452" font-size="11" fill="#555">→</text>
  <text x="415" y="452" font-size="11" font-weight="bold" fill="#c0392b">FFN (MLP)</text>
  <text x="510" y="452" font-size="10" fill="#888">Linear(256→1024→256) · GELU · Dropout</text>
  <text x="310" y="470" font-size="10" fill="#666">Pre-Norm + Residual connections on each block</text>

  <!-- Residual connection arrow -->
  <path d="M280,395 L270,395 L270,455 L295,455" fill="none" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-orange)"/>
  <text x="260" y="430" text-anchor="end" font-size="9" fill="#e67e22" font-style="italic">residual</text>

  <line x1="550" y1="606" x2="550" y2="630" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- SPLIT TO THREE HEADS -->
  <!-- ============================================================ -->
  <rect x="420" y="633" width="260" height="40" rx="6" fill="#f0f0f0" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="550" y="650" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Reshape: (B·V) → B, V</text>
  <text x="550" y="667" text-anchor="middle" font-size="10" fill="#888">rearrange('(b v) f c → b v f c') → [B, V, F, 256]</text>

  <!-- Split lines -->
  <line x1="550" y1="673" x2="550" y2="695" stroke="#555" stroke-width="1.5"/>
  <line x1="280" y1="695" x2="820" y2="695" stroke="#555" stroke-width="1.5"/>
  <line x1="280" y1="695" x2="280" y2="710" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="550" y1="695" x2="550" y2="710" stroke="#3498db" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="820" y1="695" x2="820" y2="710" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ============================================================ -->
  <!-- POSITION HEAD -->
  <!-- ============================================================ -->
  <rect x="420" y="713" width="260" height="70" rx="8" fill="url(#grad-head)" stroke="#27ae60" stroke-width="2"/>
  <text x="550" y="736" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">Position Head (MLP)</text>
  <text x="550" y="753" text-anchor="middle" font-size="10" fill="#555">Linear(256→256) → GELU → Dropout → Linear(256→63)</text>
  <text x="550" y="770" text-anchor="middle" font-size="10" fill="#888">reshape → [B, V, F, J, 3]</text>
  <line x1="550" y1="783" x2="550" y2="808" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ============================================================ -->
  <!-- VELOCITY HEAD -->
  <!-- ============================================================ -->
  <rect x="100" y="713" width="260" height="70" rx="8" fill="url(#grad-head)" stroke="#3498db" stroke-width="2"/>
  <text x="230" y="736" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5276">Velocity Decoder</text>
  <text x="230" y="753" text-anchor="middle" font-size="10" fill="#555">Conv1d(256→256, k=3) → LayerNorm → MLP</text>
  <text x="230" y="770" text-anchor="middle" font-size="10" fill="#888">→ [B, V, F, J, 3]</text>
  <line x1="230" y1="783" x2="230" y2="808" stroke="#3498db" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ============================================================ -->
  <!-- ACCELERATION HEAD -->
  <!-- ============================================================ -->
  <rect x="740" y="713" width="260" height="70" rx="8" fill="url(#grad-head)" stroke="#e67e22" stroke-width="2"/>
  <text x="870" y="736" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04000">Acceleration Decoder</text>
  <text x="870" y="753" text-anchor="middle" font-size="10" fill="#555">Conv1d(256→256, k=3) → LayerNorm → MLP</text>
  <text x="870" y="770" text-anchor="middle" font-size="10" fill="#888">→ [B, V, F, J, 3]</text>
  <line x1="870" y1="783" x2="870" y2="808" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ============================================================ -->
  <!-- OUTPUTS -->
  <!-- ============================================================ -->
  <!-- Position output -->
  <rect x="445" y="813" width="210" height="42" rx="10" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="550" y="832" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Refined Joints</text>
  <text x="550" y="847" text-anchor="middle" font-size="10" fill="#e8f5e9">[B, V, F, J, 3]</text>

  <!-- Velocity output -->
  <rect x="125" y="813" width="210" height="42" rx="10" fill="#3498db" stroke="#2471a3" stroke-width="2"/>
  <text x="230" y="832" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Velocity</text>
  <text x="230" y="847" text-anchor="middle" font-size="10" fill="#d6eaf8">[B, V, F, J, 3]</text>

  <!-- Acceleration output -->
  <rect x="765" y="813" width="210" height="42" rx="10" fill="#e67e22" stroke="#ca6f1e" stroke-width="2"/>
  <text x="870" y="832" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Acceleration</text>
  <text x="870" y="847" text-anchor="middle" font-size="10" fill="#fdebd0">[B, V, F, J, 3]</text>

  <!-- ============================================================ -->
  <!-- BOTTOM: Training Losses -->
  <!-- ============================================================ -->
  <line x1="550" y1="855" x2="550" y2="875" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="300" y="878" width="500" height="20" rx="4" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="550" y="892" text-anchor="middle" font-size="11" fill="#555">Training Loss: L = SmoothNetLoss(pos) + wₓ·L1(vel) + wₐ·L1(acc)</text>

  <!-- Legend -->
  <rect x="20" y="740" width="60" height="100" rx="4" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="755" text-anchor="middle" font-size="9" font-weight="bold" fill="#555">Params</text>
  <text x="50" y="772" text-anchor="middle" font-size="9" fill="#555">dim=256</text>
  <text x="50" y="787" text-anchor="middle" font-size="9" fill="#555">depth=8</text>
  <text x="50" y="802" text-anchor="middle" font-size="9" fill="#555">heads=8</text>
  <text x="50" y="817" text-anchor="middle" font-size="9" fill="#555">FFN=1024</text>
  <text x="50" y="832" text-anchor="middle" font-size="9" fill="#555">14.3M</text>

</svg>
